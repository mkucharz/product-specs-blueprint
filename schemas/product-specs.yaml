name: product-specs
version: "0.1.0"
description: >
  Product-spec schema for the Memory knowledge graph. Models an OpenSpec-style
  spec workflow — capabilities, requirements, scenarios, changes, artifacts,
  task groups, tasks — together with release-anchored delivery and test-suite
  verification. Lets product specs live in the graph instead of repository
  files while keeping a queryable product timeline.
author: emergent
license: MIT
repositoryUrl: https://github.com/mkucharz/product-specs-blueprint

objectTypes:

  - name: Capability
    label: Capability
    description: >
      A durable, product-defined domain of behaviour (e.g. auth, cases,
      documents) — the graph equivalent of a capability spec. Cumulative: it
      accumulates requirements over many changes and is never deleted.
    properties:
      name:
        type: string
        description: "Human-readable capability name. E.g. Authentication"
      purpose:
        type: string
        description: "One-paragraph statement of what the capability provides."
      status:
        type: string
        description: "Lifecycle state. One of: active, deprecated"
      description:
        type: string

  - name: Requirement
    label: Requirement
    description: >
      A single behavioural requirement belonging to a capability. Authored as
      part of a change (status: proposed) and reconciled onto the capability
      when the change is archived (status: active). A modification edits the
      requirement text, producing a new object version rather than a new object.
    properties:
      text:
        type: string
        description: "The requirement statement, including its normative keyword (SHALL/SHOULD/MAY)."
      strength:
        type: string
        description: "Normative keyword. One of: SHALL, SHOULD, MAY"
      origin:
        type: string
        description: "How the owning change affects this requirement. One of: added, modified, removed"
      reason:
        type: string
        description: "Why the requirement is removed (only for origin: removed)."
      migration:
        type: string
        description: "Migration guidance for consumers (only for origin: removed)."
      status:
        type: string
        description: "Lifecycle state. One of: proposed, active, deprecated"
      description:
        type: string

  - name: Scenario
    label: Scenario
    description: >
      A concrete WHEN/THEN example attached to a requirement, mirroring the
      OpenSpec scenario grammar.
    properties:
      when:
        type: array
        items: string
        description: "One or more WHEN clauses. E.g. [a user submits valid credentials]"
      then:
        type: array
        items: string
        description: "One or more THEN clauses. E.g. [the user is authenticated]"
      description:
        type: string

  - name: Change
    label: Change
    description: >
      A proposed change to one or more capabilities — the unit of authoring,
      implementation, delivery, and archive. Equivalent to an OpenSpec change
      directory.
    properties:
      name:
        type: string
        description: "Change slug. E.g. add-password-auth"
      status:
        type: string
        description: "Lifecycle state. One of: draft, active, implemented, archived"
      workflow:
        type: string
        description: "Authoring workflow schema. E.g. spec-driven"
      created:
        type: string
        description: "ISO-8601 creation timestamp."
      archived_at:
        type: string
        description: "ISO-8601 archive timestamp, set when the change is archived."
      base_ref:
        type: string
        description: "Base branch/ref the change targets. E.g. main"
      description:
        type: string

  - name: Artifact
    label: Artifact
    description: >
      A markdown artifact of a change — its proposal or design document. The
      full markdown is carried in the body property.
    properties:
      kind:
        type: string
        description: "Artifact kind. One of: proposal, design"
      body:
        type: string
        description: "Full markdown content of the artifact."
      order:
        type: number
        description: "Display order within the change."
      description:
        type: string

  - name: TaskGroup
    label: Task Group
    description: A numbered section of a change's task list.
    properties:
      ordinal:
        type: number
        description: "Section number. E.g. 1"
      title:
        type: string
        description: "Section title. E.g. Gateway data layer"
      description:
        type: string

  - name: Task
    label: Task
    description: An individual checklist item within a task group.
    properties:
      number:
        type: string
        description: "Task number within the change. E.g. 1.1"
      text:
        type: string
        description: "Task description."
      done:
        type: boolean
        description: "Whether the task is complete."
      description:
        type: string

  - name: Release
    label: Release
    description: >
      A shipped product release. The authoritative delivery anchor and the
      product-timeline spine: requirements and changes delivered in it link
      here via delivered_in.
    properties:
      version:
        type: string
        description: "Release version. E.g. v1.2.0"
      name:
        type: string
        description: "Human-readable release name."
      released_at:
        type: string
        description: "ISO-8601 release timestamp."
      notes:
        type: string
        description: "Release notes."
      channel:
        type: string
        description: "Release channel. E.g. stable, beta, canary"
      description:
        type: string

  - name: TestSuite
    label: Test Suite
    description: >
      A thin, in-pack representation of the test suite that verifies a
      requirement, so verification stays orthogonal to delivery. A future
      shared type registry may reconcile this with the code-structure pack's
      TestSuite.
    properties:
      name:
        type: string
        description: "Test suite identifier."
      status:
        type: string
        description: "Latest run state. E.g. passed, failed, unknown"
      passed_at:
        type: string
        description: "ISO-8601 timestamp of the last passing run."
      description:
        type: string

relationshipTypes:

  - name: has_requirement
    label: Has Requirement
    description: A capability owns a requirement.
    sourceType: Capability
    targetType: Requirement

  - name: has_scenario
    label: Has Scenario
    description: A requirement owns a scenario.
    sourceType: Requirement
    targetType: Scenario

  - name: depends_on
    label: Depends On
    description: A capability depends on another capability.
    sourceType: Capability
    targetType: Capability

  - name: proposes_change
    label: Proposes Change
    description: >
      A change proposes an added, modified, or removed capability. Carries an
      operation property: added | modified | removed.
    sourceType: Change
    targetType: Capability

  - name: has_artifact
    label: Has Artifact
    description: A change owns a proposal or design artifact.
    sourceType: Change
    targetType: Artifact

  - name: has_task_group
    label: Has Task Group
    description: A change owns a task group.
    sourceType: Change
    targetType: TaskGroup

  - name: contains_task
    label: Contains Task
    description: A task group contains a task.
    sourceType: TaskGroup
    targetType: Task

  - name: addresses
    label: Addresses
    description: A task delivers or addresses a requirement.
    sourceType: Task
    targetType: Requirement

  - name: delivered_in
    label: Delivered In
    description: >
      A requirement or change was delivered in a release. The authoritative
      delivery edge; Release.released_at is when it shipped.
    sourceTypes:
      - Requirement
      - Change
    targetType: Release

  - name: verified_by
    label: Verified By
    description: >
      A requirement is verified by a test suite. Orthogonal to delivered_in:
      a requirement may be delivered yet unverified, or verified yet
      unreleased.
    sourceType: Requirement
    targetType: TestSuite
